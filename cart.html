<!-- ===== CHECKOUT MODAL ===== -->
<div id="checkoutModal" style="
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    z-index:9999;
    overflow-y:auto;
">

    ">

        <h2 style="margin-top:0;">Checkout</h2>

                padding:13px;

                color:white;
                cursor:pointer;

            </button>

        </div>

    </div>
</div>

<script>

function getCart() {
    return JSON.parse(localStorage.getItem("zyloCart")) || [];
}


function saveCart(cart) {
    localStorage.setItem("zyloCart", JSON.stringify(cart));
}


function renderCart() {
    const cartItems = document.getElementById("cartItems");
    const cartTotal = document.getElementById("cartTotal");
    const cartSubtotal = document.getElementById("cartSubtotal");
    const cartSubtitle = document.getElementById("cartSubtitle");
    const headerCartCount = document.getElementById("headerCartCount");
    const cart = getCart();
    const totalQuantity = cart.reduce((sum, item) => sum + (Number(item.quantity) || 0), 0);
    if (cartSubtitle) cartSubtitle.textContent = `${totalQuantity} ${totalQuantity === 1 ? "item" : "items"} in your cart`;
    if (headerCartCount) headerCartCount.textContent = totalQuantity;

    if (cart.length === 0) {
        cartItems.innerHTML = `
          <div class="empty-cart">
            <div class="empty-cart-icon">🛍️</div>
            <h2>Your Cart is Empty</h2>
            <p>Add some beautiful jewellery and continue shopping.</p>
            <a href="products.html" class="continue-btn">Continue Shopping</a>
          </div>`;
        cartTotal.textContent = "₹0";
        if (cartSubtotal) cartSubtotal.textContent = "₹0";
        return;
    }

    let total = 0;
    cartItems.innerHTML = cart.map((item, index) => {
        const price = Number(item.price) || 0;
        const quantity = Number(item.quantity) || 1;
        total += price * quantity;
        const safeName = String(item.name || "Jewellery item").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const image = item.image || "";
        return `
          <article class="cart-item">
            <img src="${image}" alt="${safeName}" onerror="this.style.opacity='0.25'">
            <div class="item-info">
              <h3>${safeName}</h3>
              <div class="item-description">Elegant · Everyday Style · ZyLo Jewellery</div>
              <div class="item-price">₹${price.toLocaleString("en-IN")}</div>
              <div class="item-actions">
                <div class="quantity-box" aria-label="Quantity controls">
                  <button type="button" aria-label="Decrease quantity" onclick="changeQuantity(${index}, -1)">−</button>
                  <span>${quantity}</span>
                  <button type="button" aria-label="Increase quantity" onclick="changeQuantity(${index}, 1)">+</button>
                </div>
                <button type="button" class="remove-btn" onclick="removeItem(${index})">♧ &nbsp; Remove</button>
              </div>
            </div>
          </article>`;
    }).join("");
    const formattedTotal = `₹${total.toLocaleString("en-IN")}`;
    cartTotal.textContent = formattedTotal;
    if (cartSubtotal) cartSubtotal.textContent = formattedTotal;
}

function changeQuantity(index, change) {

    const cart = getCart();

    cart[index].quantity += change;

    if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
    }

    saveCart(cart);

    renderCart();
    window.dispatchEvent(new Event("cartUpdated"));
}


function removeItem(index) {

    const cart = getCart();

    cart.splice(index, 1);

    saveCart(cart);

    renderCart();

    window.dispatchEvent(new Event("cartUpdated"));
}


function checkout() {

    const cart = getCart();

    if (cart.length === 0) {
        alert("Cart empty hai.");
        return;
    }

    document.getElementById("checkoutModal").style.display = "block";
}


function closeCheckout() {
    document.getElementById("checkoutModal").style.display = "none";
}

// ding ding
async function placeCartOrder() {

    const name = document.getElementById("checkoutName").value.trim();
    const phone = document.getElementById("checkoutPhone").value.trim();
    const address = document.getElementById("checkoutAddress").value.trim();
    const payment = document.getElementById("checkoutPayment").value;

    const cart = getCart();

    if (cart.length === 0) {
        alert("Cart empty hai.");
        return;
    }

    if (!name || !phone || !address || !payment) {
        alert("Please fill all fields ❗");
        return;
    }

    if (!/^[6-9]\d{9}$/.test(phone)) {
        alert("⚠️ Please enter a valid 10-digit mobile number!");
        return;
    }

    const totalPrice = cart.reduce(
        (total, item) => total + (item.price * item.quantity),
        0
    );

    const totalQuantity = cart.reduce(
        (total, item) => total + item.quantity,
        0
    );

    const productNames = cart.map(
        item => `${item.name} x ${item.quantity}`
    ).join(", ");

    try {

        // ==============================
        // 1. SAVE ORDER IN SUPABASE
        // ==============================

        const { data, error } = await supabaseClient
            .from("orders")
            .insert([
                {
                    customer_name: name,
                    phone: phone,
                    product_name: productNames,
                    quantity: totalQuantity,
                    price: totalPrice,
                    total_price: totalPrice,
                    payment_method: payment,
                    address: address,
                    status: "pending"
                }
            ]);

        if (error) {
            console.error("Supabase Order Error:", error);
            throw new Error("Order database mein save nahi hua.");
        }


        // ==============================
        // 2. SEND EMAIL
        // ==============================

        await emailjs.send(
            "service_7u8bcaq",
            "template_hvrqw6j",
            {
                from_name: name,
                phone: phone,
                quantity: totalQuantity,
                payment: payment,
                address: address,
                product: productNames,
                price: "₹" + totalPrice,
                total_price: "₹" + totalPrice
            }
        );


        // ==============================
        // 3. SUCCESS
        // ==============================

        alert("✅ Order placed successfully!\n\nEmail notification bhi send ho gayi.");

        localStorage.removeItem("zyloCart");

        closeCheckout();

        renderCart();

    } catch (error) {

        console.error("Cart Order Error:", error);

        alert(
            "❌ Order place nahi ho paya.\n\n" +
            error.message
        );
    }
}


renderCart();

</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders | ZyLo Mart</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --pink: #e87991;
            --pink-dark: #d95f7b;
            --ink: #171923;
            --muted: #747987;
            --page: #faf9f8;
            --line: #ecebed;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--page);
            color: var(--ink);
            padding-bottom: 88px;
        }
        a { color: inherit; }
        .navbar {
            min-height: 116px;
            background: rgba(255,255,255,.97);
            padding: 18px max(22px, calc((100% - 1180px) / 2));
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            border-bottom: 1px solid #f0eeee;
        }
        .brand { text-decoration: none; display: inline-block; }
        .logo { font-size: clamp(36px, 5vw, 58px); font-weight: 500; letter-spacing: -2.5px; line-height: 1; }
        .logo-star { font-size: .4em; vertical-align: top; margin-left: 2px; }
        .tagline { margin-top: 12px; font-size: 11px; letter-spacing: 4px; color: #777985; white-space: nowrap; }
        .nav-actions { display: flex; align-items: center; gap: 24px; }
        .icon-link { text-decoration: none; position: relative; display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; }
        .icon-link svg { width: 30px; height: 30px; stroke: currentColor; fill: none; stroke-width: 1.8; }
        .cart-badge { position: absolute; top: -2px; right: -5px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 99px; display: grid; place-items: center; color: white; background: var(--pink); font-size: 11px; }
        .container { width: min(1120px, 100%); margin: 32px auto 50px; padding: 0 24px; }
        .page-heading { display: flex; align-items: flex-start; gap: 22px; margin-bottom: 32px; }
        .back-link { text-decoration: none; font-size: 38px; line-height: 1; margin-top: 3px; }
        h1 { font-size: clamp(32px, 4.5vw, 48px); letter-spacing: -.8px; line-height: 1.12; }
        .subtitle { color: var(--muted); font-size: 17px; margin-top: 10px; }
        .filters { display: flex; gap: 12px; overflow-x: auto; padding: 2px 1px 12px; margin-bottom: 16px; scrollbar-width: none; }
        .filters::-webkit-scrollbar { display: none; }
        .filter-btn { flex: 0 0 auto; border: 1px solid #e6e4e6; border-radius: 999px; background: white; color: #626674; padding: 12px 22px; min-width: 100px; font-size: 15px; cursor: pointer; transition: .18s ease; }
        .filter-btn.active { background: linear-gradient(135deg, #e98299, #df6c87); border-color: transparent; color: white; box-shadow: 0 5px 14px #e879912b; }
        #loading { text-align: center; padding: 36px 12px; color: var(--muted); }
        .order-list { display: grid; gap: 18px; }
        .order-card { background: white; border: 1px solid #f1eff0; border-radius: 22px; padding: 22px; box-shadow: 0 5px 22px rgba(29, 24, 32, .055); }
        .order-summary { display: grid; grid-template-columns: 142px minmax(0, 1fr) 28px; align-items: center; gap: 22px; width: 100%; border: 0; background: transparent; color: inherit; text-align: left; cursor: pointer; }
        .product-image { width: 142px; height: 142px; border-radius: 18px; object-fit: cover; background: #f5eee9; display: block; }
        .image-placeholder { display: grid; place-items: center; color: #b4a39a; font-size: 38px; }
        .product-name { font-size: 21px; line-height: 1.3; font-weight: 700; overflow-wrap: anywhere; }
        .order-meta { color: var(--muted); margin-top: 9px; font-size: 15px; }
        .meta-dot { margin: 0 9px; }
        .status { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 9px 15px; margin-top: 14px; font-weight: 700; font-size: 14px; background: #f0f0f0; color: #575b65; }
        .status::before { content: "●"; font-size: 13px; }
        .status.processing, .status.pending { background: #fde9ed; color: #b43e56; }
        .status.confirmed { background: #e8f1ff; color: #2560a9; }
        .status.shipped { background: #e8f1ff; color: #2560a9; }
        .status.delivered { background: #e5f7eb; color: #21804a; }
        .status.cancelled { background: #eeeeef; color: #60636c; }
        .status.processing::before, .status.pending::before { content: "◷"; font-size: 18px; }
        .status.confirmed::before { content: "✓"; }
        .status.shipped::before { content: "▣"; }
        .status.delivered::before { content: "✓"; }
        .status.cancelled::before { content: "×"; }
        .order-date { color: var(--muted); font-size: 14px; margin-top: 10px; }
        .chevron { font-size: 32px; color: #646976; transition: transform .2s; }
        .order-card.expanded .chevron { transform: rotate(90deg); }
        .order-details { display: none; border-top: 1px solid var(--line); margin-top: 20px; padding-top: 18px; }
        .order-card.expanded .order-details { display: block; }
        .details-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px 22px; color: #41434c; font-size: 14px; line-height: 1.5; }
        .details-grid strong { color: var(--ink); }
        .total { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 16px; font-size: 20px; font-weight: 700; }
        .empty { background: white; padding: 40px 20px; text-align: center; border-radius: 18px; box-shadow: 0 5px 22px rgba(29,24,32,.05); }
        .empty h2 { margin-bottom: 10px; }
        .empty p { color: var(--muted); line-height: 1.5; }
        .primary-link { display: inline-block; margin-top: 20px; padding: 12px 22px; background: var(--pink); color: white; text-decoration: none; border-radius: 999px; }
        .bottom-nav { display: none; }
        @media (max-width: 650px) {
            body { padding-bottom: 88px; }
            .navbar { min-height: 100px; padding: 18px 20px 16px; }
            .logo { font-size: 44px; }
            .tagline { font-size: 9px; letter-spacing: 3px; margin-top: 9px; }
            .nav-actions { gap: 15px; }
            .icon-link { width: 34px; height: 38px; }
            .icon-link svg { width: 27px; height: 27px; }
            .container { margin: 24px auto 28px; padding: 0 16px; }
            .page-heading { gap: 16px; margin-bottom: 26px; }
            .back-link { font-size: 34px; }
            h1 { font-size: 34px; }
            .subtitle { font-size: 15px; margin-top: 8px; }
            .filters { gap: 9px; margin-right: -16px; padding-right: 16px; margin-bottom: 10px; }
            .filter-btn { padding: 11px 17px; min-width: auto; font-size: 14px; }
            .order-list { gap: 14px; }
            .order-card { padding: 16px; border-radius: 20px; }
            .order-summary { grid-template-columns: 92px minmax(0,1fr) 16px; gap: 13px; }
            .product-image { width: 92px; height: 92px; border-radius: 14px; }
            .product-name { font-size: 16px; line-height: 1.3; }
            .order-meta { font-size: 13px; margin-top: 6px; }
            .meta-dot { margin: 0 5px; }
            .status { font-size: 12px; padding: 7px 11px; margin-top: 9px; gap: 6px; }
            .order-date { font-size: 12px; line-height: 1.4; margin-top: 7px; }
            .chevron { font-size: 25px; }
            .details-grid { grid-template-columns: 1fr; gap: 10px; font-size: 14px; }
            .total { font-size: 18px; }
            .bottom-nav { position: fixed; z-index: 20; bottom: 0; left: 0; right: 0; height: 76px; display: grid; grid-template-columns: repeat(3, 1fr); align-items: center; background: rgba(255,255,255,.98); border-top: 1px solid #eee9ec; box-shadow: 0 -5px 18px rgba(20,20,20,.04); padding-bottom: env(safe-area-inset-bottom); }
            .bottom-nav a { text-decoration: none; color: #777b86; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; min-height: 65px; }
            .bottom-nav a.active { color: #171923; }
            .bottom-nav svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; }
            .bottom-nav .nav-icon-wrap { position: relative; }
            .bottom-nav .cart-badge { top: -5px; right: -10px; }
        }
        @media (max-width: 370px) {
            .order-summary { grid-template-columns: 76px minmax(0,1fr) 12px; gap: 10px; }
            .product-image { width: 76px; height: 76px; }
            .product-name { font-size: 14px; }
            .order-meta { font-size: 12px; }
        }
    </style>
</head>

<body>
    <header class="navbar">
        <a class="brand" href="index.html" aria-label="Zylo home">
            <div class="logo">Zylo<span class="logo-star">✦</span></div>
            <div class="tagline">JEWELLERY&nbsp; • &nbsp;STYLE&nbsp; • &nbsp;YOU</div>
        </a>
        <nav class="nav-actions" aria-label="Main navigation">
            <a class="icon-link" href="products.html" aria-label="Search products">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.2"></circle><path d="m16.2 16.2 5 5"></path></svg>
            </a>
            <a class="icon-link" href="cart.html" aria-label="Shopping cart">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h2l2.5 12.2a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L21 7H5"></path><circle cx="9" cy="21" r="1.2"></circle><circle cx="18" cy="21" r="1.2"></circle></svg>
                <span class="cart-badge" id="cartCount">0</span>
            </a>
        </nav>
    </header>

    <main class="container">
        <div class="page-heading">
            <a class="back-link" href="account.html" aria-label="Go back">‹</a>
            <div>
                <h1>My Orders</h1>
                <p class="subtitle">Track and manage your orders</p>
            </div>
        </div>

        <div class="filters" id="orderFilters" aria-label="Filter orders">
            <button class="filter-btn active" type="button" data-filter="all">All</button>
            <button class="filter-btn" type="button" data-filter="processing">Processing</button>
            <button class="filter-btn" type="button" data-filter="shipped">Shipped</button>
            <button class="filter-btn" type="button" data-filter="delivered">Delivered</button>
            <button class="filter-btn" type="button" data-filter="cancelled">Cancelled</button>
        </div>

        <div id="loading">Loading your orders...</div>
        <div id="ordersContainer" class="order-list"></div>
    </main>

    <nav class="bottom-nav" aria-label="Mobile navigation">
        <a href="index.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"></path></svg>
            <span>Home</span>
        </a>
        <a href="cart.html">
            <span class="nav-icon-wrap">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h2l2.5 12.2a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L21 7H5"></path><circle cx="9" cy="21" r="1.2"></circle><circle cx="18" cy="21" r="1.2"></circle></svg>
                <span class="cart-badge" id="bottomCartCount">0</span>
            </span>
            <span>Cart</span>
        </a>
        <a href="account.html" class="active">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"></circle><path d="M4 21v-2a8 8 0 0 1 16 0v2z"></path></svg>
            <span>Account</span>
        </a>
    </nav>

    <script>
        const supabaseUrl = "https://ghgpuncmdupypxdfhibk.supabase.co";
        const supabaseKey = "sb_publishable_wyPuvavd5bq6Fb8FgE_mFg_lszjv1Ld";
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let allOrders = [];
        let productLookup = [];
        let activeFilter = "all";

        function normalizedStatus(status) {
            const value = String(status || "pending").toLowerCase().trim();
            if (["pending", "processing", "confirmed"].includes(value)) return "processing";
            if (value === "shipped" || value === "dispatched") return "shipped";
            if (value === "delivered" || value === "complete" || value === "completed") return "delivered";
            if (value === "cancelled" || value === "canceled") return "cancelled";
            return value;
        }

        function displayStatus(status) {
            const normalized = normalizedStatus(status);
            if (normalized === "processing") return "Processing";
            if (normalized === "shipped") return "Shipped";
            if (normalized === "delivered") return "Delivered";
            if (normalized === "cancelled") return "Cancelled";
            return String(status || "Pending").replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
        }

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            })[char]);
        }

        function getProductImage(order) {
            const orderProductId = order.product_id ?? order.productId;
            const matchById = orderProductId != null
                ? productLookup.find(p => String(p.id) === String(orderProductId))
                : null;
            const matchByName = productLookup.find(p =>
                String(p.name || "").trim().toLowerCase() === String(order.product_name || "").trim().toLowerCase()
            );
            const product = matchById || matchByName;
            return order.product_image || order.image_url || order.image || product?.image || product?.image_url || product?.image_url_1 || "";
        }

        function formatDate(value) {
            if (!value) return "Date unavailable";
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return "Date unavailable";
            return date.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
        }

        function money(value) {
            const amount = Number(value || 0);
            return "₹" + amount.toLocaleString("en-IN", { maximumFractionDigits: 2 });
        }

        function orderTotal(order) {
            if (order.total_price != null) return order.total_price;
            return Number(order.price || 0) * Number(order.quantity || 1);
        }

        function renderOrders() {
            const container = document.getElementById("ordersContainer");
            const filtered = activeFilter === "all"
                ? allOrders
                : allOrders.filter(order => normalizedStatus(order.status) === activeFilter);

            if (!filtered.length) {
                const message = allOrders.length
                    ? "There are no " + activeFilter + " orders right now."
                    : "You haven't placed any orders yet.";
                container.innerHTML = `<div class="empty"><h2>${allOrders.length ? "No matching orders" : "No Orders Yet 📦"}</h2><p>${escapeHTML(message)}</p><a class="primary-link" href="products.html">Continue Shopping</a></div>`;
                return;
            }

            container.innerHTML = "";
            filtered.forEach(order => {
                const statusKey = normalizedStatus(order.status);
                const image = getProductImage(order);
                const date = formatDate(order.created_at);
                const qty = Number(order.quantity || 1);
                const price = order.price ?? 0;
                const card = document.createElement("article");
                card.className = "order-card";
                card.innerHTML = `
                    <button class="order-summary" type="button" aria-expanded="false">
                        ${image
                            ? `<img class="product-image" src="${escapeHTML(image)}" alt="${escapeHTML(order.product_name || "Ordered product")}" loading="lazy" onerror="this.outerHTML='<div class=&quot;product-image image-placeholder&quot;>💎</div>'">`
                            : `<div class="product-image image-placeholder" aria-hidden="true">💎</div>`}
                        <span class="summary-content">
                            <span class="product-name">${escapeHTML(order.product_name || "Product")}</span>
                            <span class="order-meta">${qty} ${qty === 1 ? "item" : "items"} <span class="meta-dot">•</span> ${money(price)}</span>
                            <span class="status ${escapeHTML(statusKey)}">${escapeHTML(displayStatus(order.status))}</span>
                            <span class="order-date">${statusKey === "delivered" ? "Delivered" : "Order placed"} on ${escapeHTML(date)}</span>
                        </span>
                        <span class="chevron" aria-hidden="true">›</span>
                    </button>
                    <div class="order-details">
                        <div class="details-grid">
                            <div><strong>Order ID:</strong> #${escapeHTML(order.id)}</div>
                            <div><strong>Quantity:</strong> ${qty}</div>
                            <div><strong>Price:</strong> ${money(price)}</div>
                            <div><strong>Payment:</strong> ${escapeHTML(order.payment_method || "N/A")}</div>
                            <div><strong>Order Date:</strong> ${escapeHTML(new Date(order.created_at).toLocaleString("en-IN"))}</div>
                            <div><strong>Customer:</strong> ${escapeHTML(order.customer_name || "N/A")}</div>
                            <div><strong>Phone:</strong> ${escapeHTML(order.phone || "N/A")}</div>
                            <div><strong>Address:</strong> ${escapeHTML(order.address || "N/A")}</div>
                        </div>
                        <div class="total">Total: ${money(orderTotal(order))}</div>
                    </div>`;
                card.querySelector(".order-summary").addEventListener("click", () => {
                    const expanded = card.classList.toggle("expanded");
                    card.querySelector(".order-summary").setAttribute("aria-expanded", String(expanded));
                });
                container.appendChild(card);
            });
        }

        document.querySelectorAll(".filter-btn").forEach(button => {
            button.addEventListener("click", () => {
                activeFilter = button.dataset.filter;
                document.querySelectorAll(".filter-btn").forEach(item => item.classList.toggle("active", item === button));
                renderOrders();
            });
        });

        function updateCartCount() {
            let cart = [];

            try {
                cart = JSON.parse(
                    localStorage.getItem("zyloCart") || "[]"
                );
            } catch (error) {
                console.error("Cart read error:", error);
            }

            const count = cart.reduce(
                (total, item) => total + (Number(item.quantity) || 1),
                0
            );

            const topCount = document.getElementById("cartCount");
            const bottomCount = document.getElementById("bottomCartCount");

            if (topCount) {
                topCount.textContent = count;
            }

            if (bottomCount) {
                bottomCount.textContent = count;
            }
        }

        updateCartCount();

        window.addEventListener("cartUpdated", updateCartCount);

        window.addEventListener("storage", function (event) {
            if (event.key === "zyloCart") {
                updateCartCount();
            }
        });

        async function loadMyOrders() {
            const loading = document.getElementById("loading");
            const container = document.getElementById("ordersContainer");

            const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
            if (userError || !user) {
                loading.style.display = "none";
                container.innerHTML = `<div class="empty"><h2>Please Login First</h2><p>You need to login to see your orders.</p><a class="primary-link" href="login.html">Login</a></div>`;
                return;
            }

            const { data: orders, error } = await supabaseClient
                .from("orders")
                .select("*")
                .eq("user_id", user.id)
                .order("created_at", { ascending: false });

            loading.style.display = "none";
            if (error) {
                console.error("Orders Error:", error);
                container.innerHTML = `<div class="empty"><h2>Something went wrong</h2><p>Unable to load your orders. Please refresh and try again.</p></div>`;
                return;
            }

            allOrders = orders || [];
            // Product images are optional; if lookup fails, orders still render with a jewellery placeholder.
            const { data: products } = await supabaseClient.from("products").select("*");
            productLookup = products || [];
            renderOrders();
        }

        loadMyOrders();
        updateCartCount();
    </script>

</body>
</html>
